name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The ebuild takes its version from ${PV} in the filename and the RPM spec
  # from --define version, so both follow the tag on their own. deploy/nix's is
  # written down in package.nix, so we gate the release on it.
  nix-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy/nix/package.nix matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(grep -oP '^\s*version \? "\K[^"]+' deploy/nix/package.nix || true)"

          if [ -z "$got" ]; then
            echo "::error file=deploy/nix/package.nix::cannot read the version, has the argument been renamed?"
            exit 1
          fi

          if [ "$got" != "$want" ]; then
            echo "::error file=deploy/nix/package.nix::version is ${got}, but the tag is ${TAG}. Bump it to ${want}."
            exit 1
          fi

          echo "deploy/nix/package.nix is at ${got}, matching ${TAG}."

  goreleaser:
    needs: nix-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This removes AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache), where setup-go
      # installs Go, so it must happen before Go is put on PATH or later steps
      # hit "go: command not found".
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          df -h

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Gentoo/Portage builds in a network-isolated sandbox, so the ebuild in
      # deploy/gentoo needs the Go module cache supplied as a distfile. Built
      # in RUNNER_TEMP to keep the working tree clean because GoReleaser refuses
      # to run on a dirty tree.
      - name: Build Go module cache tarball
        id: deps
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="hyperuplink-${version}-deps.tar.xz"
          GOMODCACHE="${RUNNER_TEMP}/go-mod" go mod download -modcacherw
          tar --create --auto-compress \
              --file "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" go-mod
          echo "tarball=${RUNNER_TEMP}/${tarball}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach the module cache to the release GoReleaser just created so the
      # ebuild's SRC_URI can fetch it.
      - name: Attach Go module cache to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.deps.outputs.tarball }}
        run: gh release upload "$TAG" "$TARBALL" --clobber
