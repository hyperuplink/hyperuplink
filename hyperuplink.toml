[General]
Mode = "development"

[Logging]
Level = "debug"

[Redis]
Addresses = ["127.0.0.1:6379"]

[Database]
Connection = "postgres://postgres:postgres@localhost:5432/hyperuplink_dev?sslmode=disable"

[Server]
BindIP             = "0.0.0.0"
Port               = 3000
BodyLimit          = 67108864
Concurrency        = 262144
ProxyHeader        = "" # "X-Forwarded-For"
EnableIPValidation = false
TrustProxy         = false
TrustLoopback      = true
TrustProxies       = []
ReduceMemoryUsage  = false
ServerHeader       = ""

[Users]
PromoteAdmin = ["dummy1@example.com"]

[[Target]]
ID = "notifications"
Type = "email"
Email.SMTPServer = "smtp.example.org"
Email.SMTPTLSPolicy = 0
Email.SMTPAuthType = "AUTODISCOVER"
Email.SMTPUsername = "user"
Email.SMTPPassword = "pass"
Email.From.Email = "reply@example.org"
Email.From.Name = "Example.org"

# [[Target]]
# ID = "primary"
# Type = "xmpp"

[[Storage]]
ID = "profile-pictures"
Type = "S3"
S3.Endpoint = "http://localhost:9000"
S3.Region = "us-east-1"
S3.AccessKey = "minioadmin"
S3.SecretKey = "minioadmin"
S3.PublicURL = "http://localhost:9000"
S3.PublicDownload = true
S3.PresignedDownload = false
