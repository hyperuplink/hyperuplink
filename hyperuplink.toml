[[Target]]
ID = "debug-email"
Type = "debug"
Debug.Emulates = "email"
Debug.Path = "/tmp/hyperuplink-messages"

[[Target]]
ID = "debug-xmpp"
Type = "debug"
Debug.Emulates = "xmpp"
Debug.Path = "/tmp/hyperuplink-messages"

[[Storage]]
ID = "remote-storage"
Type = "S3"
S3.Endpoint = "http://localhost:9000"
S3.Region = "us-east-1"
S3.AccessKey = "minioadmin"
S3.SecretKey = "minioadmin"
S3.PublicURL = "http://localhost:9000"
S3.PublicDownload = true
S3.PresignedDownload = false

[[Storage]]
ID = "local-storage"
Type = "Local"
Local.Path = "/tmp/www"
Local.PublicURI = "/media"
