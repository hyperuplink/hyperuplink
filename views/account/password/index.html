<div class="margin window active">
  <div class="title-bar">
    <div class="title-bar-text">{{$.Site.Title}}</div>
  </div>
  <div class="window-body {{$.Site.GetRoute.AsID}}">
    {{ $user := .Data.Get "user"}}
    <form method="post"
          action="{{$.Site.GetFormAction "update"}}"
          class="">
      <input type="hidden" name="_csrf" value="{{$.Site.GetCSRFToken}}">
      <div class="flex-row flex-wrap gap margin">
        <fieldset class="flex-column grow padding">
          <legend>{{$._.T "password"}}</legend>
          <div class="fieldrow flex-row flex-wrap gap">
            <div class="field flex-column grow">
              {{$.Form.Input "password" "current_password" "" true}}
            </div>
          </div>
          <div class="fieldrow flex-row flex-wrap gap">
            <div class="field flex-column grow">
              {{$.Form.Input "password" "new_password" "" true}}
            </div>
            <div class="field flex-column grow">
              {{$.Form.Input "password" "new_password_repeat" "" true}}
            </div>
          </div>
        </fieldset>
      </div>
      <div class="actions margin flex-row justify-end gap">
        <button type="submit" class="affirmative" title="{{$._.T "update"}}">{{$._.T "update"}}</button>
      </div>
    </form>
  </div>
</div>
