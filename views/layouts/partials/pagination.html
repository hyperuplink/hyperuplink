{{ $dict := . }}
{{ $site := get $dict "Site"}}
{{ $pages := get $dict "pages"}}
{{ $page := get $dict "page"}}
<div class="pagination flex-row justify-center gap margin">
  <div class="button disabled">|&lt;</div>
  <div class="button disabled">&lt;-</div>
  {{ range $i, $e := untilStep 1 $pages 1 }}
  <div class="button {{ if eq $page $e }}active{{ end }}">{{$e}}</div>
  {{ end }}
  <div class="button">-&gt;</div>
  <div class="button">&gt;|</div>
</div>
