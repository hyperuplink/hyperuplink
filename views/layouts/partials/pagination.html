{{ $dict := . }}
{{ $site := get $dict "Site"}}
{{ $pager := $site.GetPager}}
{{ $pgv := $pager.GetView}}
<div class="pagination flex-row justify-center gap margin">
  {{ range $i, $pv := $pgv }}
  <a class="button {{ if eq $pv.Active true }}active{{ end }} {{ if eq $pv.Disabled true }}disabled{{ end }}"
     {{ if eq $pv.Disabled false }}
     href="?page={{$pv.Page}}"
     {{ end }}
     title="{{ safeHTML $pv.Label }}">{{ safeHTML $pv.Label }}</a>
  {{ end }}
</div>
