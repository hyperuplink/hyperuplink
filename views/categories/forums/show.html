<!-- FORUM -->
{{ $forum := .Data.Get "forum" }}
{{ $topics := .Data.Get "topics" }}
{{ template "views/layouts/partials/flash" . }}
<div class="margin window active">
  <div class="title-bar">
    <div class="title-bar-text">{{$forum.Name}}</div>
  </div>
  <div class="window-body">
    {{ template "views/layouts/partials/topics" dict "Site" .Site "Forum" $forum "Topics" $topics }}
  </div>
</div>
<!-- END FORUM -->
