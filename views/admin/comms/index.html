<div class="margin window active">
  <div class="title-bar">
    <div class="title-bar-text">{{$.Site.Title}}</div>
  </div>
  <div class="window-body {{$.Site.GetRoute.AsID}}">
    {{ template "views/layouts/partials/flash" . }}
    <div class="button-block margin">
      {{$menu := ($.Menu.AdminCommsMenu $.Session.GetCurrentUserRole)}}
      {{ template "views/layouts/partials/menu-overview" dict "Site" .Site "Menu" $menu }}
    </div>
  </div>
</div>
