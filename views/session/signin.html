<div class="margin window authentication active">
  <div class="title-bar">
    <div class="title-bar-text">{{._.T .Site.Title}}</div>
  </div>
  <div class="window-body {{$.Site.GetRoute.AsID}}">
    <form method="post">
      <input type="hidden" name="_csrf" value="{{.Site.GetCSRFToken}}">
      <div class="tabs margin">
        <div role="tabpanel" id="tab1" class="padding">
          <div class="margin">
            <div class="fieldrow flex-row flex-wrap gap">
              <div class="field flex-column grow">
                {{.Form.Input "text" "username" "" true}}
              </div>
              <div class="field flex-column grow">
                {{.Form.Input "password" "password" "" true}}
              </div>
            </div>
            <div class="actions flex-row gap justify-end">
              <button type="submit">{{._.T "sign_in_verb"}}</button>
            </div>
          </div>
        </div>
      </div>
    </form>
    {{ if .Site.OauthProviders }}
    <div class="margin">{{._.T "sign_in_via_oauth"}}</div>
    {{ template "views/layouts/partials/oauthproviders" . }}
    {{ end }}
  </div>
</div>
