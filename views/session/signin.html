<div class="margin window authentication active">
  <div class="title-bar">
    <div class="title-bar-text">Sign in</div>
  </div>
  <div class="window-body">
    {{ template "views/layouts/partials/errors" . }}
    <form method="post">
      <input type="hidden" name="_csrf" value="{{.Site.GetCSRFToken}}">
      <div class="tabs margin">
        <div role="tabpanel" id="tab1" class="padding">
          <div class="margin">
            <div class="fieldrow flex-row flex-wrap gap">
              <div class="field flex-column grow">
                <label for="username">Username</label>
                <input type="text" id="username" name="username">
              </div>
              <div class="field flex-column grow">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
              </div>
            </div>
            <div class="actions flex-row gap justify-end">
              <button type="submit">Sign in</button>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div class="margin">Or sign in via:</div>
    {{ template "views/layouts/partials/oauthproviders" . }}
  </div>
</div>
