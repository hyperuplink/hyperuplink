<div class="margin window authentication active">
  <div class="title-bar">
    <div class="title-bar-text">{{.Site.I18n.Get "sign_up_noun"}}</div>
  </div>
  <div class="window-body">
    <div class="errors">
      {{ with .Errors.Get }}
      <div class="error raised margin padding">{{$.Site.T .Error}}</div>
      {{ end }}
      {{ range $field, $err := .Errors.GetMap }}
      <div class="error raised margin padding">{{$.Site.T $err.Error}}</div>
      {{ end }}
    </div>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{.Site.GetCSRFToken}}">
      <div class="tabs margin">
        <div role="tabpanel" id="tab1" class="padding">
          <div class="margin">
            <div class="fieldrow flex-row flex-wrap gap">
              <div class="field flex-column grow">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       value="{{.Form.StringValueFor "username"}}"
                       class="{{.Errors.ClassFor "username"}}">
              </div>
              <div class="field flex-column grow">
                <label for="username">E-mail</label>
                <input type="text"
                       id="email"
                       name="email"
                       value="{{.Form.StringValueFor "email"}}"
                       class="{{.Errors.ClassFor "email"}}">
              </div>
            </div>
            <div class="fieldrow flex-row flex-wrap gap">
              <div class="field flex-column grow">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       value="{{.Form.StringValueFor "password"}}"
                       class="{{.Errors.ClassFor "password"}}">
              </div>
              <div class="field flex-column grow">
                <label for="password">Repeat</label>
                <input type="password"
                       id="password_repeat"
                       name="password_repeat"
                       value="{{.Form.StringValueFor "password_repeat"}}"
                       class="{{.Errors.ClassFor "password_repeat"}}">
              </div>
            </div>
            <div class="actions flex-row gap justify-end">
              <button type="submit">Sign up</button>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div class="margin">Or sign up via:</div>
    <div class="social margin">
      <div class="actions flex-column gap">
        {{$oaps := .Site.OauthProviders}}
        {{ range $oaps }}
        <a class="button {{.Class}}" href="{{.Href}}" title="{{.Title}}">{{ safeHTML .Label }}</a>
        {{ end }}
      </div>
    </div>
  </div>
</div>
