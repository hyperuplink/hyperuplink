<div class="margin window authentication active">
  <div class="title-bar">
    <div class="title-bar-text">{{._.T .Site.Title}}</div>
  </div>
  <div class="window-body">
    {{ template "views/layouts/partials/flash" . }}
    <form method="post">
      <input type="hidden" name="_csrf" value="{{.Site.GetCSRFToken}}">
      <div class="tabs margin">
        <div role="tabpanel" id="tab1" class="padding">
          <div class="margin">
            <div class="fieldrow flex-row flex-wrap gap">
              <div class="field flex-column grow">
                <label for="username">{{._.T "username"}}</label>
                <input type="text"
                       id="username"
                       name="username"
                       value="{{.Form.StringValueFor "username"}}"
                       class="{{.Flash.ClassFor "username"}}">
              </div>
              <div class="field flex-column grow">
                <label for="username">{{._.T "current_email"}}</label>
                <input type="text"
                       id="email"
                       name="email"
                       value="{{.Form.StringValueFor "email"}}"
                       class="{{.Flash.ClassFor "email"}}">
              </div>
            </div>
            <div class="actions flex-row gap justify-end">
              <button type="submit" class="affirmative">{{._.T "confirm"}}</button>
              <a class="button"
                 href="{{.Site.HrefTo "session/confirm/resend"}}"
                 title="{{._.T "resend_confirmation"}}">{{._.T "resend_confirmation"}}</a>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
