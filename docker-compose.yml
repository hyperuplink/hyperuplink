# Hyperuplink
#
#   docker compose up -d                  # app + postgres + valkey
#   docker compose --profile minio up -d  # additionally start MinIO (S3)
#
# Change the postgres/minio credentials below AND the matching values in
# deploy/hyperuplink.toml before exposing this to the internet.

name: hyperuplink

services:
  hyperuplink:
    # The app image is pulled from ghcr.io by default. To build it locally from
    # this repo instead, comment out `image:` and uncomment the `build:` block.
    #
    image: ghcr.io/hyperuplink/hyperuplink:latest
    # build:
    #   context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # On SELinux-enforcing hosts (Fedora/RHEL) append ",z": ...:ro,z
      - ./deploy/hyperuplink.toml:/etc/hyperuplink.toml:ro
      - mediadata:/var/lib/hyperuplink/media
    networks:
      - hyperuplink

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyperuplink
      POSTGRES_PASSWORD: hyperuplink
      POSTGRES_DB: hyperuplink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperuplink -d hyperuplink"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperuplink

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperuplink

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperuplink

networks:
  hyperuplink:
    driver: bridge

volumes:
  pgdata:
  valkeydata:
  miniodata:
  mediadata:
