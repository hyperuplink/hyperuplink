{{- if not .Values.existingConfigSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperuplink.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperuplink.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.configFileKey }}: |-
    {{- required "`.Values.config` must not be empty when `existingConfigSecret` is unset." .Values.config | nindent 4 }}
{{- end }}
