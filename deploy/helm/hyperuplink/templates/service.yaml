apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyperuplink.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperuplink.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.service.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hyperuplink.selectorLabels" . | nindent 4 }}
